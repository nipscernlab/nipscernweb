  <style>
    /* Noodle
       ------------------------------------------------------------------
       Uma cor, e ela é estado. A gema marca o que está escolhido, o "sim", a
       ação principal e a coluna que venceu; nada mais é amarelo. O resto é o
       cinza do site, em três pesos de texto, e o que separa as partes de um
       formulário é espaço e uma linha fina, não caixas dentro de caixas.

       O vidro. Os painéis usam a .glass do site, que só vale sobre algo que não
       é um preenchimento chapado (design-system.md, seção 3). O que ela tem
       para atravessar aqui é uma luz quente, larga e fraca atrás do palco
       (.nd-stage::after), dissolvida nas pontas para não desenhar borda.

       Contrastes medidos: gema sobre --bg-0, 11.6:1; tinta sobre gema, 9.8:1;
       texto secundário sobre o painel, 6.1:1. */
    .nd {
      --nd-y:      #F7C948;   /* gema */
      --nd-y-deep: #E0A800;   /* açafrão: borda do que está aceso */
      --nd-y-soft: #FFE08A;   /* manteiga: só o texto da coluna vencedora */
      --nd-ink:    #2B1F05;   /* texto sobre gema */
      --nd-red:    #ff9d8b;   /* só o que apaga */
      --pc: var(--nd-y);
    }
    .nd .eyebrow { color: var(--nd-y); }

    /* Hero: a linha do topo troca o azul da marca pela gema, e o título leva o
       sublinhado ondulado, que é o macarrão da página. */
    .nd-hero::before { background: linear-gradient(90deg, transparent, rgba(247, 201, 72, 0.4), transparent); }
    .nd-hero .nd-title {
      text-decoration: underline wavy var(--nd-y);
      text-decoration-thickness: 2px;
      text-underline-offset: 0.2em;
      text-decoration-skip-ink: none;
    }
    .nd-mascot { opacity: 1; }
    .nd-mascot img { width: 200px; height: 200px; filter: drop-shadow(0 16px 36px rgba(247, 201, 72, 0.16)); }
    @media (max-width: 768px) { .nd-mascot img { width: 140px; height: 140px; } }

    /* O palco e a sua luz. A seção fica acima do rodapé para um painel que
       desce além dela passar por cima do que vem depois, não por baixo. */
    .nd-section { position: relative; z-index: 3; }
    .nd-stage { position: relative; isolation: isolate; }
    .nd-stage::after {
      content: ''; position: absolute; inset: -140px -10vw; z-index: -1; pointer-events: none;
      background:
        radial-gradient(720px 480px at 14% 10%, rgba(247, 201, 72, 0.085), transparent 70%),
        radial-gradient(640px 460px at 86% 70%, rgba(247, 201, 72, 0.045), transparent 70%);
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 180px, #000 calc(100% - 180px), transparent);
      mask-image: linear-gradient(to bottom, transparent, #000 180px, #000 calc(100% - 180px), transparent);
    }

    /* Painéis e grade */
    .nd-single { max-width: 800px; }
    .nd-grid { display: grid; gap: var(--sp-6); align-items: start; }
    .nd-grid--home { grid-template-columns: minmax(0, 1fr) 320px; }
    .nd-grid--poll { grid-template-columns: minmax(0, 1fr) 340px; margin-top: var(--sp-6); }
    .nd-side { display: grid; gap: var(--sp-6); }
    .nd-pane { --glass-tint: rgba(255, 255, 255, 0.012); padding: var(--sp-7, 28px) var(--sp-8); min-width: 0; }
    .nd-pane + .nd-pane { margin-top: var(--sp-6); }
    .nd-pane-title { font-size: var(--text-lg); font-weight: 600; color: var(--text-primary); margin: 0 0 var(--sp-4); letter-spacing: -0.01em; }
    .nd-pane-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-4); }
    .nd-pane-head .nd-pane-title { margin: 0; }
    .nd-pane-head .nd-quiet { margin: 0; flex: 1 1 100%; }
    .nd-count-badge { font-size: var(--text-sm); color: var(--text-muted); font-weight: 500; margin-left: 2px; }
    .nd-quiet { font-size: var(--text-sm); color: var(--text-secondary); line-height: 1.6; margin: 0 0 var(--sp-3); }
    .nd-quiet--inline { margin: 0; font-size: var(--text-xs); }
    .nd-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .nd-label {
      display: block; font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: var(--sp-2);
    }
    .nd-loading { color: var(--text-secondary); display: flex; align-items: center; gap: var(--sp-2); }
    .ph-spinner { animation: nd-spin 1s linear infinite; }
    @keyframes nd-spin { to { transform: rotate(360deg); } }
    .nd-back { margin-bottom: var(--sp-4); font-size: var(--text-sm); }
    .nd-back a { display: inline-flex; align-items: center; gap: var(--sp-2); color: var(--text-secondary); text-decoration: none; }
    .nd-back a:hover { color: var(--text-primary); }

    /* Avisos */
    .nd-notice {
      display: flex; gap: var(--sp-3); align-items: flex-start;
      border-left: 2px solid var(--nd-y);
      padding: var(--sp-2) var(--sp-4); margin-bottom: var(--sp-6);
    }
    .nd-notice .ph { color: var(--nd-y); flex-shrink: 0; margin-top: 3px; }
    .nd-notice p { margin: 0; font-size: var(--text-sm); color: var(--text-primary); line-height: 1.6; }
    .nd-error { color: var(--nd-red); font-size: var(--text-sm); margin: 0 0 var(--sp-4); }

    /* Formulário: blocos separados por linha fina */
    .nd-form-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-2); }
    .nd-form-head .nd-pane-title { margin: 0; }
    .nd-block { padding: var(--sp-5) 0; border-top: 1px solid var(--border-subtle); }
    .nd-block:first-of-type { border-top: 0; padding-top: var(--sp-3); }
    .nd-block--inline { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: var(--sp-2) var(--sp-4); }
    .nd-block--inline .nd-label { margin: 0; }
    .nd-block-desc { margin: 0; }
    .nd-block--options { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4) var(--sp-8); flex-wrap: wrap; }
    .nd-form-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; padding-top: var(--sp-4); border-top: 1px solid var(--border-subtle); }

    /* O nome da reunião é o campo grande: sem caixa, só a linha embaixo. */
    .nd-title-input {
      width: 100%; background: none; border: 0; border-bottom: 1px solid var(--border-mid); border-radius: 0;
      padding: var(--sp-2) 0 var(--sp-3); margin-bottom: var(--sp-5);
      font-size: var(--text-2xl); font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary);
      transition: border-color var(--t-fast);
    }
    .nd-title-input::placeholder { color: var(--text-muted); font-weight: 500; }
    .nd-title-input:hover { border-color: var(--border-strong); }
    .nd-title-input:focus { outline: none; border-color: var(--nd-y); }

    .nd-field { min-width: 0; }
    .nd-field-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-5); }
    .nd-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: var(--r-md);
      padding: 9px 12px;
      color: var(--text-primary);
      font-size: var(--text-sm);
      line-height: 1.5;
      transition: border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
      color-scheme: dark;
    }
    .nd-input::placeholder { color: var(--text-muted); }
    .nd-input:hover { border-color: var(--border-mid); }
    .nd-input:focus { outline: none; border-color: var(--nd-y-deep); box-shadow: 0 0 0 3px rgba(247, 201, 72, 0.16); }
    .nd-input.is-missing { border-color: var(--nd-red); box-shadow: 0 0 0 3px rgba(229, 83, 61, 0.2); }
    /* Cresce com o texto (noodle.js mede o scrollHeight a cada tecla); a alça
       de arrastar do navegador sai. */
    .nd-textarea { resize: none; overflow: hidden; min-height: 2.6em; }

    /* Controle segmentado */
    .nd-seg { display: inline-flex; border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 2px; gap: 2px; background: rgba(255, 255, 255, 0.03); }
    .nd-seg--stack { display: grid; width: 100%; margin-bottom: var(--sp-5); }
    .nd-seg button {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
      padding: 7px 14px; border-radius: calc(var(--r-md) - 2px);
      font-size: var(--text-sm); font-weight: 500; color: var(--text-secondary);
      background: transparent; border: 0; cursor: pointer; white-space: nowrap;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .nd-seg button:hover { color: var(--text-primary); }
    .nd-seg button[aria-pressed="true"] { background: var(--nd-y); color: var(--nd-ink); font-weight: 600; }

    /* Interruptor */
    .nd-switch-row { display: flex; align-items: center; gap: var(--sp-3); }
    .nd-switch-row label { font-size: var(--text-sm); color: var(--text-primary); cursor: pointer; }
    .nd-switch {
      position: relative; width: 40px; height: 24px; flex-shrink: 0;
      border-radius: var(--r-full); cursor: pointer;
      background: rgba(255, 255, 255, 0.10); border: 1px solid var(--border-mid);
      transition: background var(--t-base), border-color var(--t-base);
    }
    .nd-switch-knob {
      position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--text-secondary);
      transition: transform var(--t-spring), background var(--t-base);
    }
    .nd-switch:hover { border-color: var(--border-strong); }
    .nd-switch[aria-checked="true"] { background: var(--nd-y); border-color: var(--nd-y); }
    .nd-switch[aria-checked="true"] .nd-switch-knob { transform: translateX(16px); background: var(--nd-ink); }

    /* Um campo que abre um painel: parece um campo, comporta-se como botão. */
    .nd-popwrap { position: relative; display: inline-block; max-width: 100%; }
    .nd-timebtn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 10px 7px 12px; border-radius: var(--r-md);
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-subtle);
      color: var(--text-primary); font-size: var(--text-sm); cursor: pointer;
      transition: border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
    }
    .nd-timebtn .ph { color: var(--text-muted); font-size: 0.85em; }
    .nd-timebtn:hover { border-color: var(--border-mid); background: rgba(255, 255, 255, 0.06); }
    .nd-timebtn[aria-expanded="true"] { border-color: var(--nd-y-deep); box-shadow: 0 0 0 3px rgba(247, 201, 72, 0.16); }
    .nd-timebtn.is-empty { color: var(--text-secondary); }
    /* O painel do prazo pende da borda direita da linha, não do botão: o botão
       muda de largura com o texto, a linha não. */
    .nd-dl-row { display: flex; align-items: center; gap: var(--sp-3); }
    .nd-dl-row .nd-label { margin: 0; }
    .nd-dl-row > .nd-pop { left: auto; right: 0; }
    #nd-dl { min-width: 12.5em; justify-content: space-between; }

    /* O painel: um vidro escuro logo abaixo do campo, alinhado à esquerda, ou à
       direita quando sairia da janela; para cima quando não cabe embaixo. Anima
       só no redesenho em que abriu: trocar a hora dentro dele não recomeça nada,
       porque o elemento fica e só o miolo muda. */
    @keyframes nd-pop-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .nd-pop {
      position: absolute; top: calc(100% + 8px); left: 0; z-index: 30;
      --glass-tint: rgba(9, 12, 20, 0.92);
      border-radius: var(--r-lg) !important;
      padding: var(--sp-4); min-width: 296px;
      box-shadow: var(--shadow-xl);
      text-align: left; font-family: var(--font-sans);
    }
    .nd-pop.is-new { animation: nd-pop-in 0.16s ease; }
    .nd-pop--right { left: auto; right: 0; }
    .nd-pop--up { top: auto; bottom: calc(100% + 8px); }
    .nd-pop--dl { min-width: 360px; }
    .nd-pop--tz { min-width: 320px; }
    .nd-pop--tz .nd-input { margin-bottom: var(--sp-2); }
    .nd-tz-list { display: grid; gap: 2px; max-height: 260px; overflow-y: auto; }
    .nd-tz-item {
      display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
      padding: 7px 10px; border-radius: 6px; text-align: left;
      background: transparent; border: 1px solid transparent; color: var(--text-secondary); font-size: var(--text-sm); cursor: pointer;
    }
    .nd-tz-item .nd-mono { font-size: var(--text-xs); color: var(--text-muted); }
    .nd-tz-item:hover { background: rgba(255, 255, 255, 0.04); color: var(--text-primary); }
    .nd-tz-item[aria-pressed="true"] { background: var(--nd-y); color: var(--nd-ink); font-weight: 600; }
    .nd-tz-item[aria-pressed="true"] .nd-mono { color: var(--nd-ink); }
    .nd-tz-line { flex-wrap: wrap; }
    .nd-tz-line .nd-timebtn { padding: 4px 8px 4px 10px; font-size: var(--text-xs); }
    .nd-pop-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-3); }
    .nd-pop-value { font-size: var(--text-lg); font-weight: 600; color: var(--text-primary); }
    .nd-pop-h { display: block; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 6px; }
    .nd-pop-cols { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-4); align-items: start; }
    /* Hora e minuto do prazo empilhados: lado a lado as duas grades se pisavam. */
    .nd-pop-cols--dl { margin-top: var(--sp-3); grid-template-columns: 1fr; gap: var(--sp-3); }
    .nd-pop-grid { display: grid; gap: 4px; }
    .nd-pop-grid--h { grid-template-columns: repeat(6, 1fr); }
    .nd-pop-grid--m { grid-template-columns: repeat(3, 1fr); }
    .nd-pop-grid--dlh { grid-template-columns: repeat(8, 1fr); }
    .nd-pop-grid--dlm { grid-template-columns: repeat(4, 1fr); max-width: 236px; }
    .nd-pop-cell {
      padding: 7px 8px; border-radius: 6px; min-width: 2.4em;
      font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 500;
      color: var(--text-secondary); background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent; cursor: pointer;
      transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
    }
    .nd-pop-cell:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .nd-pop-cell[aria-pressed="true"] { background: var(--nd-y); color: var(--nd-ink); font-weight: 700; }
    .nd-pop-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--sp-3); }
    .nd-pop-chips .nd-pop-cell { font-family: var(--font-sans); }
    .nd-pop-chips--top { margin: 0 0 var(--sp-3); }
    .nd-pop-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-top: var(--sp-4); }
    .nd-pop-foot > .btn:only-child { margin-left: auto; }
    .nd-stepper { display: flex; align-items: center; gap: var(--sp-2); }
    .nd-stepper-input { width: 5.5em; text-align: center; padding: 7px 8px; font-size: var(--text-base); -moz-appearance: textfield; }
    .nd-stepper-input::-webkit-outer-spin-button, .nd-stepper-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .nd-stepper-unit { font-size: var(--text-sm); color: var(--text-secondary); }
    .nd-pop .nd-cal-head { margin-bottom: var(--sp-2); }
    .nd-pop .nd-cal-month { font-size: var(--text-sm); }
    .nd-pop .nd-cal-nav { width: 28px; height: 28px; }
    .nd-pop .nd-cal-grid { gap: 3px; }
    .nd-pop .nd-cal-day { font-size: var(--text-xs); border-radius: 6px; }
    .nd-pop .nd-cal-wd { padding: 2px 0 4px; }

    /* Duração: fichas */
    .nd-dur { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--sp-4); }
    .nd-dur button, .nd-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 11px; border-radius: var(--r-full);
      font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 500;
      color: var(--text-secondary); background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border-subtle); cursor: pointer; text-decoration: none;
      transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
    }
    .nd-dur button:hover, .nd-chip:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .nd-dur button[aria-pressed="true"] { background: var(--nd-y); border-color: var(--nd-y); color: var(--nd-ink); font-weight: 700; }
    .nd-dur button .ph { font-size: 0.85em; color: var(--text-muted); }
    .nd-dur button[aria-pressed="true"] .ph { color: var(--nd-ink); }
    .nd-dur .nd-popwrap { display: inline-flex; }
    .nd-chip { font-family: var(--font-sans); }
    .nd-chip .ph { color: var(--text-muted); }

    /* Datas: calendário à esquerda, horário à direita */
    .nd-dates { display: grid; grid-template-columns: minmax(0, 400px) minmax(200px, 1fr); gap: var(--sp-8); align-items: start; }
    .nd-count { font-size: var(--text-xs); color: var(--text-secondary); margin: 0; min-height: 1.2em; }

    /* Calendário */
    .nd-cal { min-width: 0; }
    .nd-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); }
    .nd-cal-month { font-weight: 600; color: var(--text-primary); font-size: var(--text-base); }
    .nd-cal-navs { display: inline-flex; gap: 4px; }
    .nd-cal-nav {
      width: 32px; height: 32px; border-radius: var(--r-md);
      display: inline-grid; place-items: center;
      background: transparent; border: 1px solid var(--border-subtle);
      color: var(--text-secondary); cursor: pointer; transition: border-color var(--t-fast), color var(--t-fast);
    }
    .nd-cal-nav:hover:not(:disabled) { color: var(--text-primary); border-color: var(--border-strong); }
    .nd-cal-nav:disabled { color: var(--border-strong); cursor: default; }
    .nd-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .nd-cal-wd { text-align: center; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); padding: 2px 0 6px; }
    .nd-cal-pad { aspect-ratio: 1; }
    .nd-cal-day {
      aspect-ratio: 1; width: 100%;
      border-radius: var(--r-md);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      color: var(--text-primary);
      font-family: var(--font-mono); font-size: var(--text-sm); font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .nd-cal-day:hover:not(:disabled) { border-color: var(--border-strong); }
    .nd-cal-day.is-today { box-shadow: inset 0 0 0 1px var(--border-strong); }
    .nd-cal-day.is-past { color: var(--text-muted); background: transparent; cursor: default; }
    .nd-cal-day.is-selected { background: var(--nd-y); color: var(--nd-ink); font-weight: 700; }
    .nd-cal-day.is-selected:hover { border-color: var(--nd-ink); }
    .nd-cal-day:focus-visible, .nd-vote:focus-visible, .nd-seg button:focus-visible, .nd-final-opt:focus-visible,
