name: Guarda de cache-busting

# Garante que o token ?v= de todo asset versionado esteja sincronizado com o
# conteudo atual desses arquivos. O hook .githooks/pre-commit faz o bump
# automaticamente; este guard e a rede de seguranca para quando o hook nao roda
# (clone sem `git config core.hooksPath`, ou commit --no-verify).
#
# A LISTA VEM DO PROPRIO HOOK. Ela ja divergiu duas vezes, e nas duas o efeito
# foi o mesmo: o hook somava um conjunto de arquivos e o guard somava outro, os
# hashes nunca coincidiam e todo commit reprovava mesmo com o bump certo. Em vez
# de manter uma copia aqui, este job le a variavel ASSETS de .githooks/pre-commit
# e usa exatamente a mesma lista. Nao ha o que sincronizar.

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O passo do arquivo trocado no mesmo nome compara com o commit de
          # antes, que precisa estar aqui.
          fetch-depth: 0
      - name: Token ?v= bate com o hash do conteudo
        run: |
          set -euo pipefail

          # A lista, lida do hook. Se o hook nao puder ser lido, isso e um erro
          # de verdade e nao algo para contornar com um fallback silencioso.
          ASSETS=$(sed -n '/^ASSETS="/,/"$/p' .githooks/pre-commit \
                   | sed 's/^ASSETS="//; s/"$//' | grep -v '^$')
          if [ -z "$ASSETS" ]; then
            echo "::error::Nao consegui ler ASSETS de .githooks/pre-commit"
            exit 1
          fi
          echo "Assets versionados:"
          echo "$ASSETS" | sed 's/^/  /'

          # Texto e binario entram de formas diferentes, e precisam entrar.
          #
          # Nos arquivos de texto os proprios tokens saem antes do hash: os
          # modulos carregam o token nos seus imports, entao um modulo e um
          # arquivo cujo conteudo contem o hash do proprio conteudo, e sem
          # neutralizar isso o valor nunca se estabiliza.
          #
          # Os binarios entram pelo object id. Passar alguns megabytes de h264
          # por sed nao e portavel: sed trabalha linha a linha e o que ele faz
          # com bytes que nao sao texto depende da plataforma e do locale, e foi
          # exatamente assim que o hook no Windows e este job no Ubuntu passaram
          # a calcular dois numeros a partir do mesmo commit. O hook faz igual.
          ver=$( echo "$ASSETS" | while read -r a; do
                   case "$a" in
                     *.css|*.js|*.mjs)
                       git cat-file blob "HEAD:$a" | sed -E 's/\?v=[A-Za-z0-9._-]+/?v=/g' ;;
                     *)
                       git rev-parse "HEAD:$a" ;;
                   esac
                 done | git hash-object --stdin | cut -c1-10 )
          echo "Hash esperado do conteudo: $ver"

          NAMES=$(echo "$ASSETS" | sed 's#.*/##; s#\.#\\.#g' | tr '\n' '|' | sed 's/|$//')

          bad=""
          for f in $(git ls-files '*.html' 'assets/js/*.js'); do
            for t in $(grep -oE "($NAMES)\?v=[A-Za-z0-9._-]+" "$f" \
                        | sed -E 's/.*\?v=//' | sort -u); do
              [ "$t" != "$ver" ] && bad="${bad}\n  ${f}: ?v=${t}"
            done
          done

          if [ -n "$bad" ]; then
            echo "::error::Token de cache desatualizado. Rode o commit com o hook"
            echo "ativo (git config core.hooksPath .githooks) para bumpar os assets."
            echo "Esperado ?v=${ver} nos arquivos abaixo:"
            printf "%b\n" "$bad"
            exit 1
          fi
          echo "Todos os tokens ?v= batem com $ver."

      # Arquivo de assets/ sem ?v= que muda de conteudo e guarda o nome. A
      # borda da Cloudflare guarda /assets/ por um ano e o navegador por ate um
      # dia, pelo endereco: quem ja visitou continua vendo a versao velha, e a
      # limpeza da borda (purge-cache.yml) nao alcanca o navegador. Foi o caso
      # da capa do ICHEP 2026 em 18/11/2026 (#32 e #33). O que tem ?v= fica de
      # fora: e a lista ASSETS do hook, e o passo de cima confere o token dela.
      - name: Arquivo sem ?v= trocado com o mesmo nome
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Sem o commit de antes para comparar (ramo novo ou disparo manual)."
            exit 0
          fi
          ASSETS=$(sed -n '/^ASSETS="/,/"$/p' .githooks/pre-commit \
                   | sed 's/^ASSETS="//; s/"$//' | grep -v '^$')
          trocados=$(git -c core.quotePath=false diff --diff-filter=M --name-only "$BASE" HEAD -- assets/ \
                     | grep -v -x -F "$ASSETS" || true)
          if [ -n "$trocados" ]; then
            while read -r f; do
              echo "::error file=$f::$f mudou de conteudo com o mesmo nome, e quem ja visitou o site continua vendo a versao velha. Publique com outro nome, como o site faz com -v2 e -v3, e troque as referencias; se ele e pedido com ?v=, ponha-o na lista ASSETS de .githooks/pre-commit."
            done <<< "$trocados"
            exit 1
          fi
          echo "Nenhum arquivo sem ?v= trocado com o mesmo nome."
