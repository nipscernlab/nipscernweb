name: Publicacao no GitHub Pages

# Caminho alternativo de publicacao, parado de proposito, e que agora sabe disso.
#
# Quem publica o site hoje e o build "legacy" do Pages: Settings -> Pages ->
# Source em "Deploy from a branch", branch main, pasta raiz. Funciona, e um push
# no main vai ao ar em menos de um minuto.
#
# Este arquivo existe porque em 06/08/2026 aquele caminho parou de publicar por
# algumas horas. O artefato era construido normalmente, o deployment era aceito,
# e ficava em deployment_queued ate o proprio action desistir. O mesmo commit
# publicara sem erro no dia anterior, com a arvore identica, e a pagina de status
# do GitHub nao acusava incidente. Se aquilo se repetir, trocar o Source para
# "GitHub Actions" e rodar este workflow e a saida.
#
# O QUE FOI CONSERTADO AQUI
#
# Ele falhava. Nao por um defeito seu: enquanto o Source estiver em "Deploy from
# a branch", o backend do Pages simplesmente nao processa um deployment vindo de
# workflow, entao actions/deploy-pages ficava dez minutos em deployment_queued e
# morria no teto rigido de 600000 ms da propria action. Duas execucoes vermelhas
# no painel, dez minutos cada, por uma condicao que e o estado normal do
# repositorio.
#
# Um workflow que nao pode fazer o seu trabalho deve dizer isso em segundos, e
# nao falhar depois de dez minutos. O primeiro passo agora le a configuracao real
# do Pages e, se o build_type nao for "workflow", registra o motivo e encerra
# verde sem tentar publicar. Quando alguem trocar o Source, os passos seguintes
# passam a rodar sozinhos, sem editar este arquivo.

# So manual. Com o Source em "Deploy from a branch", um gatilho de push aqui
# faria cada commit criar dois deployments concorrentes para o mesmo site, e
# consumiria em dobro o limite flexivel de 10 builds/hora do Pages.
#
# Depois de trocar o Source para "GitHub Actions", acrescente:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress fica FALSE de proposito. Dois pushes em poucos minutos
# fizeram o segundo cancelar o deploy do primeiro em 06/08; com a fila do Pages
# lenta, cancelar o que ja esta rodando so atrasa mais.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Pergunta ao Pages quem esta publicando, antes de gastar dez minutos
      # descobrindo. "legacy" = Deploy from a branch, e nao ha o que fazer aqui.
      - id: mode
        name: De onde o Pages publica hoje
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo "unknown")
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"
          if [ "$build_type" = "workflow" ]; then
            echo "Source esta em GitHub Actions. Publicando por aqui."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Source do Pages e '${build_type}', nao 'workflow'." \
                 "Quem publica o site e o builder legacy, direto do branch main," \
                 "e um deployment vindo daqui ficaria na fila ate estourar o" \
                 "limite de 10 minutos da action. Nada a fazer: encerrando verde." \
                 "Para publicar por este caminho, mude Settings -> Pages -> Source" \
                 "para 'GitHub Actions' e rode de novo."
          fi

      - if: steps.mode.outputs.run == 'true'
        uses: actions/configure-pages@v6

      # O site e estatico e tem .nojekyll na raiz: nao ha build, so empacotar a
      # arvore como ela esta, o mesmo que o legacy faz com source path "/".
      #
      # A arvore tem 148 MB e 110 deles sao as capas da CERN Courier em
      # assets/images/magazine. Se um dia este caminho virar o oficial, aquilo e
      # a primeira coisa a mudar de lugar: o artefato inteiro sobe a cada
      # publicacao, e o repositorio nipscern-assets existe exatamente para isso.
      - if: steps.mode.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      # Nao adiante passar `timeout` aqui: 600000 ms (10 min) e teto rigido da
      # action, nao apenas o padrao. Passar 1800000 so produz
      #   "timeout value is greater than the allowed maximum
      #    - timeout set to the maximum of 600000 milliseconds"
      # e o deploy morre aos 10 min do mesmo jeito.
      - id: deployment
        if: steps.mode.outputs.run == 'true'
        uses: actions/deploy-pages@v5
