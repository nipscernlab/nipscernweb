  <style>
    :root { --page-accent: var(--accent-cgv); }

    /* The logo is the MBTS disc seen along the beam: eight spokes and two
       rings. The page carries that drawing outwards, the spokes running to the
       edges and two more rings at the ratio the logo's own rings keep (80 to
       200 in cgvweb_icon.svg, 2.5 times), so the logo sits at the centre of the
       page's geometry instead of on top of it. --r is the logo's
       circumradius: the octagon spans 48% of the image width. */
    .xcgv-hero {
      --logo: min(300px, 58vw);
      --r: calc(var(--logo) * 0.48);
      position: relative;
      overflow: hidden;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-h) + var(--sp-12)) var(--sp-4) var(--sp-16);
      text-align: center;
      background: color-mix(in srgb, var(--accent-cgv) 32%, var(--bg-1));
    }
    .xcgv-hero-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .xcgv-figure {
      position: relative;
      width: var(--logo);
      height: var(--logo);
    }
    .xcgv-field {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--r) * 18);
      height: calc(var(--r) * 18);
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.10);
      pointer-events: none;
    }
    .xcgv-field line,
    .xcgv-field polygon { stroke-width: 1px; vector-effect: non-scaling-stroke; }
    .xcgv-logo {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
    }
    /* The text sits on a band of the page colour, so the spokes stop at it
       instead of running through the letters. */
    .xcgv-text {
      position: relative;
      margin-top: var(--sp-8);
      padding: var(--sp-4) var(--sp-6);
      background: color-mix(in srgb, var(--accent-cgv) 32%, var(--bg-1));
    }
    .xcgv-name {
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: clamp(40px, 6vw, 64px);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin: 0;
    }
    .xcgv-desc {
      font-size: var(--text-lg);
      color: var(--text-primary);
      line-height: 1.6;
      max-width: 760px;
      margin: var(--sp-4) auto 0;
    }
    .xcgv-status {
      font-size: var(--text-sm);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin: var(--sp-3) 0 0;
    }
  </style>
